services:
  - type: web
    name: subtitle-bot-controller
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 0
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
